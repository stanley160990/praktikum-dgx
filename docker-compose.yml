# ============================================================
# Docker Compose: Sistem Pengelolaan Jadwal & Akun Kursus Mahasiswa
# Konfigurasi untuk Database Eksternal (PostgreSQL Eksisting)
# ============================================================

version: '3.8'

services:
  # ------------------------------------------------------------
  # WEB APPLICATION: React + Node.js Express Fullstack
  # Terhubung langsung ke Database PostgreSQL Eksternal yang sudah ada
  # ------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_kursus_mahasiswa
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_DRIVER: ${DB_DRIVER:-pg}
      # Arahkan ke nama container database eksternal Anda atau IP/hostname server database:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-db_kursus_mahasiswa}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres123}
      DB_SSL: ${DB_SSL:-false}
    ports:
      - "3000:3000"
    volumes:
      - app_data:/app/data
    networks:
      - kursus_network

# ------------------------------------------------------------
# NETWORKS & VOLUMES
# ------------------------------------------------------------
networks:
  # Hubungkan container app ke network tempat database PostgreSQL Anda berada.
  # Jika network sudah dibuat sebelumnya di Docker (misal oleh container database eksisting Anda),
  # Anda dapat mengaktifkan 'external: true' di bawah:
  kursus_network:
    driver: bridge
    # external: true  # <--- Aktifkan ini jika network 'kursus_network' sudah ada di Docker Anda

volumes:
  app_data:
    driver: local

# Catatan:
# Karena menggunakan Database PostgreSQL Eksternal, service 'postgres', variabel 'PGDATA',
# dan volume 'postgres_data' TIDAK DIPERLUKAN LAGI sehingga tidak ada instance database baru
# yang dibuat dan data murni membaca dari database eksisting Anda.
